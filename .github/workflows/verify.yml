# SPDX-License-Identifier: MIT
#
# Verification for the Zig package in this repository.
#
# Upstream's tree at tag v2.2 contains no .github directory: geographiclib-c
# ships no CI. So there is no upstream workflow to leave alone and none that
# could be retargeted at this repository's infrastructure. This one is entirely
# the fork's, and every step below names a command from `build.zig`.
#
# Three jobs, three different questions:
#   native      does upstream's C compile and link into the installed library in
#               both deliveries, does the facade tests, the example, both
#               upstream test programs and an independent C program hold their
#               published answers, and does the installed header plus the
#               installed pkg-config metadata serve that C program
#   cross       does the whole package compile for each of the six matrix
#   consumer    does the published module serve a program that did not write
#               it, both from inside this build graph and from a separate
#               package that depends on it by path, in both deliveries
#
# `-Dlinkage` and `-Druntime` are options of `build.zig` and this file uses the
# first and not the second. The shared delivery is covered below by installing
# it and running the same independent C program against the installed shared
# object through the installed `libgeodc.pc`, because that is the question a
# shared object has to answer and no static gate answers it. The loaded
# dispatch is not covered here at all: it needs `runtime/graph.zig` from the
# API role and a provider this file would have to invent, and a step that
# skipped itself when a file was missing would turn a missing gate into a green
# one - the same reason the 53-platform matrix is not a job in this file. The
# driver's runtime receipts are where that belongs.
#
# There is no `continue-on-error` in this file and there is no matrix row with a
# tolerated target. Each target is a separate step on purpose: a matrix row
# allowed to fail is indistinguishable from a target that was quietly dropped,
# and "we know that one is broken" is only a fact once a gate run has printed
# the failure. If a target ever does turn out to be unsupported here, the honest
# edit is to replace that step with a command that asserts the specific
# documented failure and to record the run in FORK-NOTES.md, not to add a flag
# that hides it.
#
# There is no system-library mode in this wave and therefore no system-library
# step: `build.zig` has no `b.systemIntegrationOption` and nothing links
# `-lgeodc`. The rule is recorded as NOT APPLICABLE in `build.zig`'s header,
# `README.zig.md` and `CHANGELOG.md` entry 9, and it is deliberately not turned
# into a step here that would have to be skipped.
#
# The full platform matrix is a fourth gate and it is not in this file.
# `cross-test`, run from the package root, builds and *runs* the `test` step for
# every platform in Zig 0.16.0's published Tier 1/2 table through this
# repository's own build graph, using `cross-test.profile.sh` for its settings
# (`CROSS_BUILD_STEP=test`, `CROSS_BUILD_JOBS=3`, and nothing else). It is not a
# job here because `cross-test` and its sibling helpers are a host-local tool
# with its own runner detection and its own scratch policy, not something a
# GitHub runner has; adding a job that invoked a path it does not have would
# fail for a reason that has nothing to do with this package, and wrapping that
# job in an availability check would turn a missing gate into a green one. So
# this file does not pretend to cover it and does not stand in for it: the
# `cross` job below runs nothing, and a platform with no runner on the host is
# recorded as explicit `build_only` coverage, never as a pass. The command and
# its receipts belong in README.zig.md and FORK-NOTES.md.
#
# Every expectation in this file is a published number. Nothing below asks
# whether two calls into this build agree with each other, and nothing checks a
# version string, an export list or a length.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build, tests and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # 23 records: every upstream file .paths ships, minus .gitignore, which the
      # fork appends to and which is therefore recorded as a pristine digest in a
      # comment inside UPSTREAM.sha256 instead. If this passes, the bytes the
      # build compiles are the bytes the provenance record pins.
      - name: immutable upstream source and fixture integrity
        run: sha256sum -c UPSTREAM.sha256

      # The default delivery installs to a prefix under the runner's scratch, not
      # into `zig-out` inside the checkout it is verifying: an install step that
      # writes into the tree it is gating can read back its own earlier output.
      # The shared delivery below already takes an explicit prefix, and the two
      # steps that assert against the default install both read this same prefix.
      - name: build and install
        run: zig build --prefix "$RUNNER_TEMP/prefix-default" --summary all

      # A real gate on the installed C surface: thirteen of upstream's
      # twenty-one exported functions through the installed header, not the
      # Zig facade. The remaining eight are exercised by the facade tests and
      # API exercise. Missing declarations or symbols fail compile/link;
      # incorrect numeric results fail at runtime.
      #
      # Every expected value below is copied out of upstream's own published
      # material, never derived by running this build and calling its own output
      # correct:
      #   * three cases of the 20-case corpus at tests/geodtest.c:42-123, at the
      #     per-quantity tolerances upstream applies at tests/geodtest.c:138-145,
      #     :164-172 and :191-200;
      #   * the signed-zero answers at tests/geodsigntest.c:345-368, for
      #     azi1 = +/-0 and +/-180 under GEOD_LONG_UNROLL;
      #   * Planimeter29's 1 km geodesic square, whose area upstream states as
      #     exactly 10^6 m^2 (tests/geodtest.c:1148-1164);
      #   * every shape of Planimeter0 - both pole-encircling rings, the equator
      #     diamond and the octant triangle - and its polyline length
      #     (tests/geodtest.c:897-927);
      #   * GeodSolve71's position at half its reference distance
      #     (tests/geodtest.c:613-618), which is the destination the capability
      #     fixture below asserts.
      # The two Planimeter entries are the only independent polygon oracles in
      # the tree; the rest of upstream's polygon coverage lives in
      # Planimeter0..29 inside geodtest.c and is run by the upstream-test step
      # above.
      #
      # The corpus values are upstream's, MIT, "Copyright (c) Charles Karney
      # (2015-2025) <karney@alum.mit.edu> and licensed under the MIT/X11 License."
      # They are reproduced under that notice.
      # The program is written once and linked twice below, against the static
      # archive and against the installed shared object. Two copies of it would
      # be two sets of expected values to keep in step, and the second copy
      # would be the one nobody reads again.
      - name: write the installed-C gate program
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface_gate.c" <<'C'

          #include <geodesic.h>
          #include <math.h>
          #include <stdio.h>

          /* Every expected value below is a figure copied out of upstream's own
             published material - tests/geodtest.c and tests/geodsigntest.c -
             and is reproduced under upstream's notice:

             Copyright (c) Charles Karney (2015-2025) <karney@alum.mit.edu> and
             licensed under the MIT/X11 License.

             None of it was produced by running this build. */

          /* WGS84, as upstream's own suites use it: tests/geodtest.c:25 and
             tests/geodsigntest.c:46. */
          static const double wgs84_a = 6378137, wgs84_f = 1 / 298.257223563;

          /* Three of the twenty cases in upstream's testcases[20][12]
             (tests/geodtest.c:42-123). Fields: lat1 lon1 azi1 lat2 lon2 azi2
             s12 a12 m12 M12 M21 S12, with s12 in metres, a12 in degrees, m12 in
             metres, M12/M21 dimensionless and S12 in m^2. Case 3 carries
             lon2 = 285.90344 and case 16 carries lon2 = -269.17879: both are
             unrolled, and both are reproduced only when GEOD_LONG_UNROLL is
             passed. A build that wrapped or rejected them would fail here. */
          static const double cases[3][12] = {
            {35.60777, -139.44815, 111.098748429560326,
             -11.17491, -69.95921, 129.289270889708762,
             8935244.5604818305, 80.50729714281974, 6273170.2055303837,
             0.16606318447386067, 0.16479116945612937, 12841384694976.432},
            {-66.99028, 112.2363, 173.73491240878403,
             -12.70631, 285.90344, 2.512956620913668,
             11150344.2312080241, 100.278634181155759, 6289939.5670446687,
             -0.17199490274700385, -0.17722569526345708, -121287239862139.744},
            {-25.72959, -144.90758, -153.647468693117198,
             -57.70581, -269.17879, -48.343983158876487,
             9413446.7452453107, 84.664533838404295, 6356176.6898881281,
             0.09492245755254703, 0.09737058264766572, 74515122850712.444}
          };

          static int failures = 0;

          static void check(const char *what, double got, double want, double tol) {
              if (fabs(got - want) <= tol) return;
              printf("FAIL %-28s got %.17g want %.17g +/- %.3g\n", what, got, want, tol);
              ++failures;
          }

          /* geod_geninverse over each case, at upstream's own tolerances
             (tests/geodtest.c:138-145). */
          static void check_inverse(const struct geod_geodesic *g, const double *c) {
              double lat1 = c[0], lon1 = c[1], azi1 = c[2];
              double lat2 = c[3], lon2 = c[4], azi2 = c[5];
              double s12 = 0, a12 = 0, m12 = 0, M12 = 0, M21 = 0, S12 = 0;
              double azi1a = 0, azi2a = 0;
              a12 = geod_geninverse(g, lat1, lon1, lat2, lon2,
                                    &s12, &azi1a, &azi2a,
                                    &m12, &M12, &M21, &S12);
              check("inverse azi1", azi1a, azi1, 1e-13);
              check("inverse azi2", azi2a, azi2, 1e-13);
              check("inverse s12", s12, c[6], 1e-8);
              check("inverse a12", a12, c[7], 1e-13);
              check("inverse m12", m12, c[8], 1e-8);
              check("inverse M12", M12, c[9], 1e-15);
              check("inverse M21", M21, c[10], 1e-15);
              check("inverse S12", S12, c[11], 0.1);
          }

          /* geod_gendirect by distance under GEOD_LONG_UNROLL
             (tests/geodtest.c:155, :162-172). s12 comes back exactly: it was the
             input. */
          static void check_direct(const struct geod_geodesic *g, const double *c) {
              double lat2 = 0, lon2 = 0, azi2 = 0, s12 = 0, a12 = 0;
              double m12 = 0, M12 = 0, M21 = 0, S12 = 0;
              a12 = geod_gendirect(g, c[0], c[1], c[2], GEOD_LONG_UNROLL, c[6],
                                   &lat2, &lon2, &azi2, &s12,
                                   &m12, &M12, &M21, &S12);
              check("direct lat2", lat2, c[3], 1e-13);
              check("direct lon2", lon2, c[4], 1e-13);
              check("direct azi2", azi2, c[5], 1e-13);
              check("direct s12", s12, c[6], 0);
              check("direct a12", a12, c[7], 1e-13);
              check("direct m12", m12, c[8], 1e-8);
              check("direct M12", M12, c[9], 1e-15);
              check("direct M21", M21, c[10], 1e-15);
              check("direct S12", S12, c[11], 0.1);
          }

          /* geod_gendirect by arc length (tests/geodtest.c:182, :189-200).
             a12 comes back exactly: it was the input, which is why upstream holds
             that one at tolerance 0. */
          static void check_arcdirect(const struct geod_geodesic *g, const double *c) {
              double lat2 = 0, lon2 = 0, azi2 = 0, s12 = 0, a12 = 0;
              double m12 = 0, M12 = 0, M21 = 0, S12 = 0;
              a12 = geod_gendirect(g, c[0], c[1], c[2],
                                   GEOD_ARCMODE | GEOD_LONG_UNROLL, c[7],
                                   &lat2, &lon2, &azi2, &s12,
                                   &m12, &M12, &M21, &S12);
              check("arcdirect lat2", lat2, c[3], 1e-13);
              check("arcdirect lon2", lon2, c[4], 1e-13);
              check("arcdirect azi2", azi2, c[5], 1e-13);
              check("arcdirect s12", s12, c[6], 1e-8);
              check("arcdirect a12", a12, c[7], 0);
              check("arcdirect m12", m12, c[8], 1e-8);
              check("arcdirect M12", M12, c[9], 1e-15);
              check("arcdirect M21", M21, c[10], 1e-15);
              check("arcdirect S12", S12, c[11], 0.1);
          }

          /* azi1 = +/-0 and +/-180 with GEOD_LONG_UNROLL, as published at
             tests/geodsigntest.c:345-368. Signbit matters: -180.0 and +180.0
             compare equal under fabs, and the whole apparatus in
             src/geodesic.c:169-238 exists to keep them apart. */
          static void check_signed_zero(const struct geod_geodesic *g) {
              static const double azi1[4] = {+0.0, -0.0, +180.0, -180.0};
              static const double lon2[4] = {+180.0, -180.0, +180.0, -180.0};
              static const double azi2[4] = {+180.0, -180.0, +0.0, -0.0};
              int k;
              for (k = 0; k < 4; ++k) {
                  double gotlon = 0, gotazi = 0;
                  geod_gendirect(g, 0, 0, azi1[k], GEOD_LONG_UNROLL, 15e6,
                                 0, &gotlon, &gotazi, 0, 0, 0, 0, 0);
                  if (gotlon != lon2[k] || gotazi != azi2[k] ||
                      signbit(gotlon) != signbit(lon2[k]) ||
                      signbit(gotazi) != signbit(azi2[k])) {
                      printf("FAIL signed zero azi1=%g: lon2 got %.17g (%sgn) "
                             "want %.17g (%sgn); azi2 got %.17g (%sgn) want "
                             "%.17g (%sgn)\n",
                             azi1[k], gotlon, signbit(gotlon) ? "-" : "+",
                             lon2[k], signbit(lon2[k]) ? "-" : "+",
                             gotazi, signbit(gotazi) ? "-" : "+",
                             azi2[k], signbit(azi2[k]) ? "-" : "+");
                      ++failures;
                  }
              }
          }

          /* A line that cannot compute a quantity must leave the caller's slot
             untouched rather than write something: geod_genposition intersects
             the request with l->caps (src/geodesic.c:457-466) and upstream says
             so at src/geodesic.h:523-524. Every unrequested output below is
             seeded with its own sentinel, so a build that wrote anything at all
             fails; GEOD_LONGITUDE is requested on purpose, because without it
             geod_genposition does not write plon2 at all and the "was it
             computed?" half of this check would have nothing to look at.

             The three computed answers are upstream's, not this build's: they
             are GeodSolve71 (tests/geodtest.c:613-618), which positions
             geod_directline(&l, &g, 1, 2, 45, 1e7, 0) at 0.5 * l.s13. Upstream's
             caps is 0 there, which geod_lineinit reads as the standard direct
             set GEOD_DISTANCE_IN | GEOD_LONGITUDE and then ORs in
             GEOD_LATITUDE | GEOD_AZIMUTH | GEOD_LONG_UNROLL
             (src/geodesic.c:344-346) - the identical effective set the explicit
             caps below produces. Same line, same distance, same answers, at
             upstream's own 0.5e-5 tolerance. */
          static void check_capability_refusal(const struct geod_geodesic *g) {
              struct geod_geodesicline l;
              double lat2 = -11, lon2 = -22, azi2 = -33, s12 = -44;
              double m12 = -55, M12 = -66, M21 = -77, S12 = -88;
              geod_lineinit(&l, g, 1, 2, 45.0,
                            GEOD_DISTANCE_IN | GEOD_LONGITUDE);
              geod_genposition(&l, GEOD_NOFLAGS, 0.5 * 1e7,
                               &lat2, &lon2, &azi2, &s12,
                               &m12, &M12, &M21, &S12);
              if (S12 != -88 || s12 != -44 || m12 != -55 ||
                  M12 != -66 || M21 != -77) {
                  printf("FAIL capability refusal: s12 %.17g m12 %.17g "
                         "M12 %.17g M21 %.17g S12 %.17g\n",
                         s12, m12, M12, M21, S12);
                  ++failures;
              }
              check("capability lat2", lat2, 30.92625, 0.5e-5);
              check("capability lon2", lon2, 37.54640, 0.5e-5);
              check("capability azi2", azi2, 55.43104, 0.5e-5);
          }

          /* A line with no GEOD_DISTANCE_IN and no GEOD_ARCMODE cannot take a
             distance at all: geod_genposition returns NaN and writes nothing
             (src/geodesic.c:467-471). */
          static void check_missing_input_capability(const struct geod_geodesic *g) {
              struct geod_geodesicline l;
              double lat2 = -11, lon2 = -22, azi2 = -33;
              double a12;
              geod_lineinit(&l, g, 0, 0, 45.0, GEOD_AREA);
              a12 = geod_genposition(&l, GEOD_NOFLAGS, 1e7,
                                     &lat2, &lon2, &azi2, 0, 0, 0, 0, 0);
              if (!isnan(a12) || lat2 != -11 || lon2 != -22 || azi2 != -33) {
                  printf("FAIL missing input capability: a12 %.17g lat2 %.17g "
                         "lon2 %.17g azi2 %.17g\n", a12, lat2, lon2, azi2);
                  ++failures;
              }
          }

          /* Planimeter29 (tests/geodtest.c:1148-1164): three 1000 m edges at
             azimuths 90, 0, -90 from (0,0). The enclosed geodesic square is 1 km
             by 1 km, so its area is 10^6 m^2 - an answer known from outside this
             library. Before upstream's 2022 fix it came back as 10^6 - A/2. */
          static void check_polygon_square(const struct geod_geodesic *g) {
              struct geod_polygon p;
              double area = 0, perimeter = 0;
              unsigned n;
              geod_polygon_init(&p, 0);
              geod_polygon_addpoint(g, &p, 0, 0);
              geod_polygon_addedge(g, &p, 90, 1000);
              geod_polygon_addedge(g, &p, 0, 1000);
              geod_polygon_addedge(g, &p, -90, 1000);
              n = geod_polygon_compute(g, &p, 0, 1, &area, &perimeter);
              if (n != 4) {
                  printf("FAIL polygon square: vertex count %u, upstream's own "
                         "test uses four\n", n);
                  ++failures;
              }
              check("polygon square area", area, 1000000.0, 0.01);
              /* Upstream's Planimeter29 checks the area only. There is no
                 published perimeter for this shape - the closing edge is the
                 geodesic back to (0,0) and is not stated to be 1000 m - so no
                 number is asserted here. */
          }

          /* geod_polygon_testedge has no starting vertex to work from, and says
             so in the only way it can: 0, with NaN in both outputs
             (src/geodesic.c:1939-1944). Its two siblings return num.

             The same path on a *polyline* is different and is checked too: the
             perimeter becomes NaN and the area out-parameter is never written
             at all, because the guard is `!p->polyline && pA`. The sentinel
             below is what proves the C left it alone. */
          static void check_testedge_without_point(const struct geod_geodesic *g) {
              struct geod_polygon p;
              double area = 0, perimeter = 0;
              unsigned n;
              geod_polygon_init(&p, 0);
              n = geod_polygon_testedge(g, &p, 45, 1000, 0, 1, &area, &perimeter);
              if (n != 0 || !isnan(area) || !isnan(perimeter)) {
                  printf("FAIL testedge without a point: n %u area %.17g "
                         "perimeter %.17g\n", n, area, perimeter);
                  ++failures;
              }
              /* testpoint with one vertex short behaves differently and returns
                 1 with zeroes (src/geodesic.c:1900-1905). */
              n = geod_polygon_testpoint(g, &p, 0, 0, 0, 1, &area, &perimeter);
              if (n != 1 || area != 0 || perimeter != 0) {
                  printf("FAIL testpoint with one vertex: n %u area %.17g "
                         "perimeter %.17g\n", n, area, perimeter);
                  ++failures;
              }

              /* The same call on a polyline. Upstream sets the perimeter to NaN
                 and never touches the area pointer at all, so the sentinel
                 below must come back unchanged. A build that wrote NaN there
                 would be writing through an out-parameter the guard skips, and
                 this is the one check here that proves the C did not. */
              {
                  struct geod_polygon line;
                  double line_area = -4242.0, line_perimeter = 0;
                  unsigned m;
                  geod_polygon_init(&line, 1);
                  m = geod_polygon_testedge(g, &line, 45, 1000, 0, 1,
                                            &line_area, &line_perimeter);
                  if (m != 0 || line_area != -4242.0 || !isnan(line_perimeter)) {
                      printf("FAIL testedge on an empty polyline: n %u area %.17g "
                             "perimeter %.17g\n", m, line_area, line_perimeter);
                      ++failures;
                  }
              }
          }

          /* Every shape of upstream's Planimeter0 and its polyline length
             (tests/geodtest.c:897-927), through the array entry point.

             Upstream states its vertices as two-dimensional arrays, pa[4][2] and
             so on (tests/geodtest.c:899-902), and geod_polygonarea takes two
             flat, mutable arrays of equal length (src/geodesic.h:803-805). So
             each shape is written out below as the separate latitude and
             longitude arrays it is, at exactly the size upstream declares - an
             interleaved array indexed by 2*i and 2*i+1, or a shorter
             declaration than its own initialiser list, would be measuring this
             fork's storage instead of upstream's geometry. The arrays are not
             const because upstream's parameter is not; the C reads through
             them and never writes (src/geodesic.c:1974-1983).

             Every expected value and tolerance below is upstream's own line. */
          static void check_polygonarea(const struct geod_geodesic *g) {
              /* pa: a ring at 89N encircling the pole, east-going, which
                 upstream counts as counter-clockwise seen from above the north
                 pole - hence the positive area (tests/geodtest.c:899, :909-910). */
              static double pa_lat[4] = {89, 89, 89, 89};
              static double pa_lon[4] = {0, 90, 180, 270};
              /* pb: the same ring at 89S. Same perimeter, opposite area
                 (tests/geodtest.c:900, :913-914). */
              static double pb_lat[4] = {-89, -89, -89, -89};
              static double pb_lon[4] = {0, 90, 180, 270};
              /* pc: the equator diamond (tests/geodtest.c:901, :917-918). */
              static double pc_lat[4] = {0, -1, 0, 1};
              static double pc_lon[4] = {-1, 0, 1, 0};
              /* pd: (90N,0E) -> (0,0) -> (0,90E) closes over one eighth of the
                 ellipsoid by the library's own symmetry
                 (tests/geodtest.c:902, :921-922). */
              static double pd_lat[3] = {90, 0, 0};
              static double pd_lon[3] = {0, 0, 90};
              double area = 0, perimeter = 0;

              geod_polygonarea(g, pa_lat, pa_lon, 4, &area, &perimeter);
              check("89N ring perimeter", perimeter, 631819.8745, 1e-4);
              check("89N ring area", area, 24952305678.0, 1);

              geod_polygonarea(g, pb_lat, pb_lon, 4, &area, &perimeter);
              check("89S ring perimeter", perimeter, 631819.8745, 1e-4);
              check("89S ring area is the negative", area, -24952305678.0, 1);

              geod_polygonarea(g, pc_lat, pc_lon, 4, &area, &perimeter);
              check("equator diamond perimeter", perimeter, 627598.2731, 1e-4);
              check("equator diamond area", area, 24619419146.0, 1);

              geod_polygonarea(g, pd_lat, pd_lon, 3, &area, &perimeter);
              check("octant triangle perimeter", perimeter, 30022685.0, 1);
              check("octant triangle area", area, 63758202715511.0, 1);

              /* The same three vertices as a polyline: upstream's polylength
                 (tests/geodtest.c:924-925) starts it with polylinep = 1 and asks
                 only for the perimeter, which is the length of the path and not
                 the perimeter of the closed figure above - a different number
                 from a different call, so it is checked from a different call. */
              {
                  struct geod_polygon q;
                  double plength = 0;
                  int k;
                  geod_polygon_init(&q, 1);
                  for (k = 0; k < 3; ++k) geod_polygon_addpoint(g, &q, pd_lat[k], pd_lon[k]);
                  geod_polygon_compute(g, &q, 0, 1, 0, &plength);
                  check("octant polyline length", plength, 20020719.0, 1);
              }
          }

          /* Latitude outside [-90, 90] is upstream's LatFix returning NaN
             (src/geodesic.c:150-151), applied to the input latitude by
             geod_lineinit_int at src/geodesic.c:348. A build that wrapped the
             value into range instead of invalidating it would answer a
             different question here and pass silently. */
          static void check_latitude_fix(const struct geod_geodesic *g) {
              double azi1 = 0, azi2 = 0, s12 = 0, a12 = 0;
              double lat2 = 0, lon2 = 0, azi2b = 0;

              geod_gendirect(g, 100.0, 0, 90.0, GEOD_NOFLAGS, 1e7,
                             &lat2, &lon2, &azi2b, &s12, 0, 0, 0, 0);
              if (!isnan(lat2) || !isnan(lon2) || !isnan(azi2b)) {
                  printf("FAIL LatFix on geod_direct: lat2 %.17g lon2 %.17g "
                         "azi2 %.17g from lat1 = 100\n", lat2, lon2, azi2b);
                  ++failures;
              }

              a12 = geod_geninverse(g, 100.0, 0, 0, 0,
                                    &s12, &azi1, &azi2, 0, 0, 0, 0);
              if (!isnan(s12) || !isnan(azi1) || !isnan(azi2)) {
                  printf("FAIL LatFix on geod_geninverse: s12 %.17g azi1 %.17g "
                         "azi2 %.17g from lat1 = 100\n", s12, azi1, azi2);
                  ++failures;
              }
          }

          int main(void) {
              struct geod_geodesic g;
              int i;

              geod_init(&g, wgs84_a, wgs84_f);

              for (i = 0; i < 3; ++i) {
                  check_inverse(&g, cases[i]);
                  check_direct(&g, cases[i]);
                  check_arcdirect(&g, cases[i]);
              }

              check_signed_zero(&g);
              check_capability_refusal(&g);
              check_missing_input_capability(&g);
              check_polygon_square(&g);
              check_testedge_without_point(&g);
              check_polygonarea(&g);
              check_latitude_fix(&g);

              if (failures) {
                  printf("%d check(s) failed\n", failures);
                  return 1;
              }
              printf("installed geodesic.h compiled, linked and held every "
                     "published answer\n");
              return 0;
          }
          C

      # The static delivery, linked the way a C consumer of this install has to
      # link it: through the pkg-config file `zig build` wrote, not through
      # paths copied out of the build script by hand. `--static` is what pulls
      # in `Libs.private:`, and libm is a real dependency of the archive -
      # `src/geodesic.c` calls sin, cos, sqrt, fabs, atan2, hypot, remquo and
      # atan - so a consumer that linked the archive without it would fail to
      # link. The flags are this build's own C level (`build.zig`, `c_flags`):
      # a C consumer that contracted floating point would be testing different
      # arithmetic from the library it links.
      #
      # pkg-config ships on the runner image and no `command -v` guard wraps
      # these steps: a missing tool would fail the link instead of skipping a
      # gate, which is the only acceptable way for it to show up.
      - name: "static archive: installed pkg-config metadata links and runs it"
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix-default"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          pkg-config --exists libgeodc
          echo "cflags: $(pkg-config --cflags --static libgeodc)"
          echo "libs:   $(pkg-config --libs --static libgeodc)"
          zig cc -std=c99 -ffp-contract=off -O2 \
            $(pkg-config --cflags --static libgeodc) \
            -o "$RUNNER_TEMP/c_surface_gate_static" \
            "$RUNNER_TEMP/c_surface_gate.c" \
            $(pkg-config --libs --static libgeodc)
          "$RUNNER_TEMP/c_surface_gate_static"

      # The shared delivery, installed to its own prefix and linked the same
      # way through the same metadata file, without `--static`: the shared
      # object records libm as its own `DT_NEEDED`, so the private line is not
      # part of what a dynamic consumer needs. `-Wl,-rpath` is the consumer's
      # own business and is stated here rather than hidden in `LD_LIBRARY_PATH`,
      # so the binary it produces is relocatable against the prefix it was
      # built for.
      - name: "shared object: installed pkg-config metadata links and runs it"
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix-shared"
          zig build -Dlinkage=dynamic --prefix "$prefix" --summary all
          test -f "$prefix/lib/libgeodc.so"
          test -f "$prefix/include/geodesic.h"
          test -f "$prefix/lib/pkgconfig/libgeodc.pc"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          pkg-config --exists libgeodc
          echo "cflags: $(pkg-config --cflags libgeodc)"
          echo "libs:   $(pkg-config --libs libgeodc)"
          zig cc -std=c99 -ffp-contract=off -O2 \
            $(pkg-config --cflags libgeodc) \
            -o "$RUNNER_TEMP/c_surface_gate_shared" \
            "$RUNNER_TEMP/c_surface_gate.c" \
            $(pkg-config --libs libgeodc) \
            -Wl,-rpath,"$prefix/lib"
          "$RUNNER_TEMP/c_surface_gate_shared"

      # The same facade behaviour against the shared object, not just a C
      # program: linking the module to a shared library is its own failure
      # mode, and a green static run says nothing about it. One mode is named
      # here because the two Debug and ReleaseSafe runs above are about the
      # optimizer, not about the delivery, and the driver runs the shared
      # delivery in all four modes with its own receipts.
      - name: facade tests against the shared delivery, ReleaseSafe
        run: zig build test -Dlinkage=dynamic -Doptimize=ReleaseSafe --summary all

      - name: upstream geodtest and geodsigntest against the shared delivery
        run: zig build upstream-test -Dlinkage=dynamic --summary all

      # The installed closure of the default delivery, which is the third thing
      # a package is: the header a C consumer includes, the licence text that
      # covers the binary it links, this fork's own records and upstream's doc
      # inputs. Every path is named, so a regression that silently drops one of
      # them fails here rather than in a consumer's tree. The paths are read from
      # the external prefix the default delivery installed to above, so this gate
      # is about what was installed and not about what a previous run left behind
      # in `zig-out`.
      - name: installed closure of the default delivery
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix-default"
          # `share/licenses/` and `share/doc/` are named after the published
          # module, `geographiclib`, and not after this repository's directory,
          # the manifest's `.name` or the artifact `geodc` (`build.zig:1036-1043`):
          # one spelling for the installed tree is what makes a hand-written
          # `--prefix` install and a Nix `$out` the same directory tree.
          for f in \
            "$prefix/include/geodesic.h" \
            "$prefix/lib/libgeodc.a" \
            "$prefix/lib/pkgconfig/libgeodc.pc" \
            "$prefix/LICENSE.txt" \
            "$prefix/share/licenses/geographiclib/NOTICE.md" \
            "$prefix/share/licenses/geographiclib/FORK-LICENSE.md" \
            "$prefix/share/licenses/geographiclib/UPSTREAM.md" \
            "$prefix/share/licenses/geographiclib/UPSTREAM.sha256" \
            "$prefix/share/doc/geographiclib/README.upstream.md" \
            "$prefix/share/doc/geographiclib/geodesic-c.dox.in" \
            "$prefix/share/doc/geographiclib/doxyfile.in" \
            "$prefix/share/doc/geographiclib/HEADER.html" \
            "$prefix/share/doc/geographiclib/FOOTER.html" \
          ; do
            test -f "$f" || { echo "missing from the install: $f" >&2; exit 1; }
          done
          echo "installed closure present"


      # Real runs, both optimize modes. The facade's bounds are mode-sensitive:
      # upstream leans on the compiler not folding floating-point expressions
      # (the `volatile` in sumx and AngRound, src/geodesic.c:105-116 and
      # :169-177), so a bound checked in one mode and not the other is not a
      # bound. Both are named separately because one green run says nothing
      # about the other.
      - name: facade tests, Debug
        run: zig build test -Doptimize=Debug --summary all

      - name: facade tests, ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: example program
        run: zig build smoke --summary all

      # Upstream's own two C programs, compiled and run unmodified.
      # geodsigntest does not link the archive: it includes geodesic.c directly
      # (tests/geodsigntest.c:16) and would otherwise double-define every
      # symbol. Upstream's tests/CMakeLists.txt:14-15,17-27 says the same.
      - name: upstream geodtest and geodsigntest
        run: zig build upstream-test --summary all

  cross:
    name: six-target compile-only matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # `check` compiles the C core, the facade, zig/api_exercise.zig, tests.zig,
      # smoke.zig and both upstream C programs, and runs none of them. It is a
      # compile gate: a target listed here has not been observed to produce a
      # passing test, only to produce an object.

      # Neither consumer program is inside `check`, deliberately: the dependency
      # edge runs consumer -> library, so this build graph has no handle on the
      # consumer's module. The `consumer` job below runs both of them instead.
      - name: x86_64-linux-gnu
        run: zig build check -Dtarget=x86_64-linux-gnu
      - name: aarch64-linux-gnu
        run: zig build check -Dtarget=aarch64-linux-gnu
      - name: aarch64-macos-none
        run: zig build check -Dtarget=aarch64-macos-none
      - name: x86_64-windows-gnu
        run: zig build check -Dtarget=x86_64-windows-gnu
      - name: riscv64-linux-gnu
        run: zig build check -Dtarget=riscv64-linux-gnu
      - name: wasm32-wasi
        run: zig build check -Dtarget=wasm32-wasi

      # One cell of the shared delivery. The six steps above all compile the
      # static archive, so a shared graph that had never been compiled at all
      # would leave this job green; this is the cheapest place to say it is not.
      # It is one cell and not six, and it does not replace the six: the full
      # shared matrix is the driver's, with its own receipts, for the same
      # reason the 53-platform sweep is not in this file.
      - name: x86_64-linux-gnu, shared delivery
        run: zig build check -Dtarget=x86_64-linux-gnu -Dlinkage=dynamic

  consumer:
    name: dependent package builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Two different questions, deliberately not merged.
      #
      # `zig build consumer` compiles `consumer/src/main.zig` inside this build
      # graph against the same module graph the facade's own tests use. It asks
      # whether the module carries the C archive, libm and src/ on its include
      # path to a second program.
      - name: module consumer inside this build graph
        run: zig build consumer --summary all

      # `consumer/build.zig` is a separate package: it adds
      # dep.module("geographiclib") and nothing else - no dep.artifact("geodc"),
      # no link_libc of its own - and resolves the library through the manifest
      # rather than through this build's own graph. That is the question the
      # in-graph step cannot ask. If the published module stopped carrying the
      # archive, libm or the include path, one of the two fails.
      - name: dependent package
        working-directory: consumer
        run: zig build run --summary all

      # The same two questions against the shared delivery. `consumer/build.zig`
      # forwards `-Dlinkage` to the dependency under the name the library
      # declares it, so this is the same program linked against the shared
      # object with nothing else changed. A module that carried the archive's
      # path rather than the artifact would pass the first run and fail this
      # one.
      - name: module consumer inside this build graph, shared delivery
        run: zig build consumer -Dlinkage=dynamic --summary all

      - name: dependent package, shared delivery
        working-directory: consumer
        run: zig build run -Dlinkage=dynamic --summary all